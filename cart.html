<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - HDV.com</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a2e'/><text x='50%' y='57%' dominant-baseline='middle' text-anchor='middle' font-family='Poppins, sans-serif' font-weight='700' font-size='40' fill='%23e94560'>HDV</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
        body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1a1a2e; padding: 15px 30px; color: #fff;
            position: sticky; top: 0; width: 100%; z-index: 1000;
            box-shadow: 0 2px 10px rgba(0,0,0,.3);
        }
        .nav-brand { font-size: 1.8rem; font-weight: 700; color: #e94560; letter-spacing: 1px; text-decoration: none; }
        .nav-brand span { color: #fff; }
        .back-link { color: #fff; text-decoration: none; font-weight: 500; font-size: .95rem; display: inline-flex; align-items: center; gap: 8px; }
        .back-link:hover { color: #e94560; }

        .page { flex: 1; max-width: 1100px; width: 100%; margin: 30px auto; padding: 0 20px; min-width: 0; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .page-title i { color: #e94560; }

        .cart-swiper { width: 100%; padding: 10px 5px 50px; }
        .swiper-slide { height: auto; display: flex; }

        .cart-card {
            background: #fff; border-radius: 12px; overflow: hidden; width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,.08); display: flex; flex-direction: column;
        }
        .cart-img-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #ddd; overflow: hidden; }
        .cart-img-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(18px) brightness(.9); transform: scale(1.3); }
        .cart-img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; display: block; }
        .cart-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .cart-title { font-size: 1.05rem; font-weight: 600; color: #1a1a2e; }
        .cart-bio { font-size: .88rem; color: #555; line-height: 1.55; flex: 1; }
        .cart-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .cart-buttons a {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 14px; border-radius: 6px; font-size: .85rem; font-weight: 600;
            text-decoration: none; background: #1a1a2e; color: #fff; transition: opacity .2s;
            max-width: 100%; word-break: break-word;
        }
        .cart-buttons a:hover { opacity: .85; }

        .swiper-button-next, .swiper-button-prev { color: #e94560; }
        .swiper-button-next::after, .swiper-button-prev::after { font-size: 22px; font-weight: 700; }
        .swiper-pagination-bullet-active { background: #e94560; }

        .empty { text-align: center; color: #777; padding: 40px; }

        .footer { background: #1a1a2e; color: #fff; padding: 25px 20px; text-align: center; font-size: .85rem; }

        @media (max-width: 640px) {
            .navbar { padding: 12px 20px; }
            .nav-brand { font-size: 1.4rem; }
            .swiper-button-next, .swiper-button-prev { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="nav-brand" href="index.html">HDV<span>.com</span></a>
        <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </nav>

    <main class="page">
        <h1 class="page-title"><i class="fa-solid fa-cart-shopping"></i> Cart</h1>

        <div class="swiper cart-swiper" id="cartSwiper">
            <div class="swiper-wrapper" id="cartWrapper"></div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
        <p class="empty" id="cartEmpty" style="display:none;">Data cart tidak ditemukan di cart.js.</p>
    </main>

    <footer class="footer">&copy; 2026 HDV. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="cart.js"></script>
    <script>
        function esc(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function isSafeUrl(u) {
            return /^(https?:\/\/|\/|\.\/|#|mailto:)/i.test(String(u || '').trim());
        }
        function safeColor(c) {
            return /^[#a-zA-Z0-9(),.%\s]+$/.test(String(c || '')) ? String(c).trim() : '';
        }
        function iconHtml(ic) {
            ic = String(ic || '').trim();
            if (/\.(svg|png|webp|jpg|jpeg|gif)$/i.test(ic)) return `<img src="${esc(ic)}" alt="" style="width:16px;height:16px;object-fit:contain;">`;
            if (ic && /^[a-z0-9\- ]+$/i.test(ic)) return `<i class="${ic}"></i>`;
            return '';
        }

        function buttonsHtml(list) {
            if (!Array.isArray(list)) return '';
            return list.filter(b => b && b.url && isSafeUrl(b.url)).map(b => {
                const bg = safeColor(b.bgHex), fg = safeColor(b.textHex);
                const style = (bg ? `background:${bg};` : '') + (fg ? `color:${fg};` : '');
                return `<a href="${esc(String(b.url).trim())}" target="_blank" rel="noopener noreferrer" style="${style}">${iconHtml(b.icon)}${esc(b.label || 'Link')}</a>`;
            }).join('');
        }

        function initCart() {
            const wrapper = document.getElementById('cartWrapper');
            const items = (typeof cartData !== 'undefined' && Array.isArray(cartData)) ? cartData : [];

            if (items.length === 0) {
                document.getElementById('cartSwiper').style.display = 'none';
                document.getElementById('cartEmpty').style.display = 'block';
                return;
            }

            wrapper.innerHTML = items.map(item => {
                const img = esc(item.img || 'img/unknown.webp');
                const btns = buttonsHtml(item.buttons);
                return `
                <div class="swiper-slide">
                    <div class="cart-card">
                        <div class="cart-img-wrap">
                            <img src="${img}" alt="" aria-hidden="true" class="cart-img-bg" loading="lazy">
                            <img src="${img}" alt="${esc(item.title || '')}" class="cart-img" loading="lazy">
                        </div>
                        <div class="cart-body">
                            ${item.title ? `<h3 class="cart-title">${esc(item.title)}</h3>` : ''}
                            <p class="cart-bio">${esc(item.bio || '')}</p>
                            ${btns ? `<div class="cart-buttons">${btns}</div>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Loop butuh slide cukup banyak; duplikat otomatis bila data sedikit
            const needsDuplicate = items.length < 8;
            new Swiper('#cartSwiper', {
                loop: true,
                loopAdditionalSlides: needsDuplicate ? 4 : 0,
                spaceBetween: 20,
                grabCursor: true,
                slidesPerView: 1,
                autoplay: { delay: 3500, disableOnInteraction: false, pauseOnMouseEnter: true },
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                breakpoints: {
                    640:  { slidesPerView: 2 },
                    1024: { slidesPerView: 3 }
                }
            });
        }

        initCart();
    </script>
</body>
</html>
