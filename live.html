<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKLIVE - SPA Video Player</title>
    <!-- FontAwesome Icons (Updated to latest v6.x CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --surface-hover: #f1f3f5;
            --text-color: #212529;
            --text-secondary: #6c757d;
            --accent-color: #ff0033;
            --border-color: #dee2e6;
            --chip-bg: #e9ecef;
            
            --dark-nav-bg: #121212;
            --dark-nav-text: #ffffff;
            --dark-nav-hover: #272727;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 60px;
            background-color: var(--dark-nav-bg);
            color: var(--dark-nav-text);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            position: relative;
        }

        .logo-icon::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 10px solid #121212;
            margin-left: 2px;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .logo-text span {
            color: var(--accent-color);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .nav-search-btn, .nav-menu-btn {
            background: none;
            border: none;
            color: var(--dark-nav-text);
            font-size: 1.1rem;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-nav-hover);
            transition: background 0.2s;
        }

        .nav-search-btn:hover, .nav-menu-btn:hover {
            background-color: #333;
        }

        /* Dropdown Menu 3 Dots */
        .dropdown-menu {
            position: absolute;
            top: 50px;
            right: 0;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 200px;
            display: none;
            flex-direction: column;
            z-index: 1100;
            overflow: hidden;
        }

        .dropdown-menu.active {
            display: flex;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: #2a2a2a;
        }

        .dropdown-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item-left i {
            color: #ffc107;
        }

        .favorite-count-badge {
            background-color: #333;
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Views (SPA Container) */
        .view-container {
            margin-top: 60px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            padding: 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .view.active {
            display: block;
        }

        /* Search Results Info bar */
        .search-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: var(--surface-color);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .clear-search-link {
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }

        /* Home View - Responsive Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        @media (max-width: 576px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .view {
                padding: 16px;
            }
        }

        .video-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .thumbnail-container img {
            transform: scale(1.05);
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 3px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            z-index: 2;
        }

        /* Styling untuk Badge My Favorite di Pojok Kiri Bawah (Sejajar Durasi) */
        .favorite-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 3px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
            backdrop-filter: blur(2px);
        }

        .favorite-badge i {
            color: #ffc107;
        }

        .video-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-info h3 {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .page-btn {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background-color: var(--surface-hover);
        }

        .page-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Player View (SPA Dedicated Page) */
        .player-view-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }

        @media(max-width: 1024px) {
            .player-view-layout {
                grid-template-columns: 1fr;
            }
        }

        .player-main-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-details-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .player-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .player-submeta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .meta-item i {
            color: var(--accent-color);
            margin-right: 6px;
        }

        .player-bio {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 16px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag-chip {
            background-color: var(--chip-bg);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .models-container {
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .models-container span {
            color: var(--text-color);
            font-weight: 500;
        }

        /* Action Links / Buttons Styling */
        .video-action-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .custom-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }

        .custom-link-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-red { background-color: #ff0033; color: #ffffff; }
        .btn-blue { background-color: #0066cc; color: #ffffff; }
        .btn-dark { background-color: #212529; color: #ffffff; }
        .btn-green { background-color: #28a745; color: #ffffff; }

        /* Sidebar Recommendations in Player View */
        .player-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: var(--text-color);
        }

        .sidebar-card {
            display: flex;
            gap: 12px;
            cursor: pointer;
            background-color: var(--surface-color);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .sidebar-card:hover {
            background-color: var(--surface-hover);
        }

        .sidebar-thumb {
            width: 120px;
            aspect-ratio: 16/9;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
            position: relative;
        }

        .sidebar-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-thumb .favorite-badge {
            bottom: 4px;
            left: 4px;
            top: auto;
            padding: 2px 4px;
            font-size: 0.6rem;
        }

        .sidebar-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .sidebar-info h4 {
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .sidebar-info p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .more-btn {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .more-btn:hover {
            background-color: var(--surface-hover);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background-color: var(--surface-hover);
        }

        /* Footer */
        footer {
            background-color: var(--dark-nav-bg);
            color: var(--text-secondary);
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        /* Modal Search */
        .modal-search {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-search.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-box-container {
            width: 90%;
            max-width: 600px;
            background-color: var(--surface-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            gap: 10px;
        }

        .search-box-container input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
        }

        .search-box-action-btn, .search-box-container button.close-modal-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .search-box-action-btn:hover, .search-box-container button.close-modal-btn:hover {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-brand" onclick="navigateToHome()">
            <div class="logo-icon"></div>
            <div class="logo-text">DARK<span>LIVE</span></div>
        </div>
        
        <div class="nav-right-actions">
            <button class="nav-search-btn" id="openSearchModal" title="Cari">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="nav-menu-btn" id="openMenuDropdown" title="Menu">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu" id="navDropdownMenu">
                <button class="dropdown-item" onclick="filterFavorites()">
                    <div class="dropdown-item-left">
                        <i class="fa-solid fa-star"></i> Favorites
                    </div>
                    <span class="favorite-count-badge" id="favoriteCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- SPA Views Container -->
    <div class="view-container">
        
        <!-- View 1: Home / Catalog View -->
        <div id="homeView" class="view">
            <div id="searchInfoBar" class="search-info-bar" style="display: none;">
                <span id="searchResultText"></span>
                <span class="clear-search-link" onclick="clearSearch()">検索をクリア</span>
            </div>
            <div class="video-grid" id="videoGrid"></div>
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- View 2: Player SPA View -->
        <div id="playerView" class="view">
            <button class="back-btn" onclick="navigateToHome()">
                <i class="fa-solid fa-arrow-left"></i> ホームに戻る
            </button>
            <div class="player-view-layout">
                <!-- Main Player Column -->
                <div class="player-main-col">
                    <div class="player-wrapper" id="playerWrapper"></div>
                    <div class="player-details-card">
                        <h1 class="player-title" id="detailTitle">動画タイトル</h1>
                        <div class="player-submeta">
                            <div class="meta-item"><i class="fa-solid fa-folder"></i><span id="detailCategory">カテゴリ</span></div>
                            <div class="meta-item"><i class="fa-solid fa-calendar"></i><span id="detailRelease">2026-01-01</span></div>
                            <div class="meta-item"><i class="fa-solid fa-globe"></i><span id="detailCountry">国</span></div>
                            <div class="meta-item"><i class="fa-solid fa-clock"></i><span id="detailDuration">00:00</span></div>
                        </div>
                        <p class="player-bio" id="detailBio">動画の説明文がここに表示されます...</p>
                        <div class="models-container">
                            出演者 / モデル: <span id="detailModels">-</span>
                        </div>
                        <div class="tags-container" id="detailTags"></div>
                        <div class="video-action-links" id="detailActionLinks"></div>
                    </div>
                </div>

                <!-- Sidebar Recommendations Column -->
                <div class="player-sidebar">
                    <h3>おすすめ動画</h3>
                    <div id="sidebarList"></div>
                    <button class="more-btn" id="sidebarMoreBtn" onclick="loadMoreSidebar()">もっと見る</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 DARKLIVE SPA Player. All rights reserved.</p>
    </footer>

    <!-- Modal Search -->
    <div class="modal-search" id="searchModal">
        <div class="search-box-container">
            <input type="text" id="searchInput" placeholder="タイトル、カテゴリ、タグで検索...">
            <button class="search-box-action-btn" id="executeSearchBtn" title="検索"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="close-modal-btn" id="closeSearchModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- Memuat Data Terpisah dari vidbase.js -->
    <script src="vidbase.js"></script>

    <script>
        // --- STATE & ROUTER SPA ---
        let currentPage = 1;
        const itemsPerPage = 12;
        let currentSearchQuery = "";
        let isFavoriteFilterActive = false; // Status filter khusus favorit
        let currentVideoIndex = null;
        let sidebarDisplayLimit = 5;

        // Elemen DOM
        const homeView = document.getElementById('homeView');
        const playerView = document.getElementById('playerView');
        const videoGrid = document.getElementById('videoGrid');
        const paginationEl = document.getElementById('pagination');
        const searchInfoBar = document.getElementById('searchInfoBar');
        const searchResultText = document.getElementById('searchResultText');
        
        const searchModal = document.getElementById('searchModal');
        const openSearchModalBtn = document.getElementById('openSearchModal');
        const closeSearchModalBtn = document.getElementById('closeSearchModal');
        const executeSearchBtn = document.getElementById('executeSearchBtn');
        const searchInput = document.getElementById('searchInput');

        // Elemen Dropdown Menu Nav
        const openMenuDropdownBtn = document.getElementById('openMenuDropdown');
        const navDropdownMenu = document.getElementById('navDropdownMenu');
        const favoriteCountEl = document.getElementById('favoriteCount');

        // Elemen Player Detail
        const playerWrapper = document.getElementById('playerWrapper');
        const detailTitle = document.getElementById('detailTitle');
        const detailCategory = document.getElementById('detailCategory');
        const detailRelease = document.getElementById('detailRelease');
        const detailCountry = document.getElementById('detailCountry');
        const detailDuration = document.getElementById('detailDuration');
        const detailBio = document.getElementById('detailBio');
        const detailModels = document.getElementById('detailModels');
        const detailTags = document.getElementById('detailTags');
        const detailActionLinks = document.getElementById('detailActionLinks');
        const sidebarList = document.getElementById('sidebarList');
        const sidebarMoreBtn = document.getElementById('sidebarMoreBtn');

        // --- HITUNG JUMLAH FAVORITE OTOMATIS ---
        function updateFavoriteCount() {
            if (typeof vidbase !== 'undefined') {
                const count = vidbase.filter(video => video.star === true).length;
                favoriteCountEl.innerText = count;
            }
        }

        // --- RENDER HOME CATALOG ---
        function renderHome() {
            homeView.classList.add('active');
            playerView.classList.remove('active');
            playerWrapper.innerHTML = "";
            updateFavoriteCount();

            let sortedVidbase = [...vidbase].sort((a, b) => new Date(b.release) - new Date(a.release));

            // Filter berdasarkan Favorite jika diaktifkan dari dropdown
            if (isFavoriteFilterActive) {
                sortedVidbase = sortedVidbase.filter(video => video.star === true);
            }

            // Filter berdasarkan input search biasa
            let filteredData = sortedVidbase.filter(video => {
                const q = currentSearchQuery.toLowerCase();
                const matchTitle = video.title.toLowerCase().includes(q);
                const matchCategory = video.category.toLowerCase().includes(q);
                const matchCountry = video.country.toLowerCase().includes(q);
                const matchTags = video.tags.some(tag => tag.toLowerCase().includes(q));
                const matchModels = video.models.some(m => m.toLowerCase().includes(q));
                return matchTitle || matchCategory || matchCountry || matchTags || matchModels;
            });

            if (isFavoriteFilterActive) {
                searchInfoBar.style.display = "flex";
                searchResultText.innerText = `⭐ My Favorites: ${filteredData.length} 件の動画が見つかりました`;
            } else if (currentSearchQuery.trim() !== "") {
                searchInfoBar.style.display = "flex";
                searchResultText.innerText = `「${currentSearchQuery}」の検索結果: ${filteredData.length} 件の動画が見つかりました`;
            } else {
                searchInfoBar.style.display = "none";
            }

            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedData = filteredData.slice(startIndex, startIndex + itemsPerPage);

            videoGrid.innerHTML = "";
            if (paginatedData.length === 0) {
                videoGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">動画が見つかりませんでした。</p>`;
            } else {
                paginatedData.forEach((video) => {
                    const originalIndex = vidbase.indexOf(video);
                    
                    const favoriteHtml = video.star ? `
                        <div class="favorite-badge">
                            <i class="fa-solid fa-star"></i> My Favorite
                        </div>
                    ` : '';

                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail-container">
                            ${favoriteHtml}
                            <img src="${video.imgurl}" alt="${video.title}">
                            <div class="video-duration">${video.duration}</div>
                        </div>
                        <div class="video-info">
                            <h3>${video.title}</h3>
                            <div class="video-meta-row">
                                <span>${video.category}</span>
                                <span>${video.release}</span>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => navigateToPlayer(originalIndex));
                    videoGrid.appendChild(card);
                });
            }

            renderPagination(totalPages);
        }

        // --- RENDER PAGINATION ---
        function renderPagination(totalPages) {
            paginationEl.innerHTML = "";
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderHome();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            paginationEl.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderHome();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                paginationEl.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderHome();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            paginationEl.appendChild(nextBtn);
        }

        // --- RENDER PLAYER SPA VIEW ---
        function navigateToPlayer(index) {
            currentVideoIndex = index;
            sidebarDisplayLimit = 5;
            const video = vidbase[index];

            homeView.classList.remove('active');
            playerView.classList.add('active');

            detailTitle.innerText = video.title;
            detailCategory.innerText = video.category;
            detailRelease.innerText = video.release;
            detailCountry.innerText = video.country;
            detailDuration.innerText = video.duration;
            detailBio.innerText = video.bio;
            detailModels.innerText = video.models.join(", ");

            detailTags.innerHTML = "";
            video.tags.forEach(tag => {
                const chip = document.createElement('span');
                chip.className = 'tag-chip';
                chip.innerText = `#${tag}`;
                detailTags.appendChild(chip);
            });

            detailActionLinks.innerHTML = "";
            if (video.links && video.links.length > 0) {
                video.links.forEach(link => {
                    const a = document.createElement('a');
                    a.className = `custom-link-btn ${link.class}`;
                    a.href = link.url;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square"></i> ${link.label}`;
                    detailActionLinks.appendChild(a);
                });
            }

            playerWrapper.innerHTML = `
                <div id="playerPoster" style="width:100%; height:100%; position:relative; cursor:pointer;">
                    <img src="${video.imgurl}" alt="${video.title}" style="width:100%; height:100%; object-fit:cover;">
                    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(255,0,51,0.9); color:#fff; width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition:transform 0.2s;">
                        <i class="fa-solid fa-play" style="margin-left: 4px;"></i>
                    </div>
                </div>
            `;

            const playerPoster = document.getElementById('playerPoster');
            playerPoster.addEventListener('click', () => {
                playerWrapper.innerHTML = `
                    <iframe src="${video.vidurl}" allowfullscreen allowtransparency allow="autoplay" scrolling="no" frameborder="0" style="width:100%; height:100%; border:none;"></iframe>
                `;
            });

            renderSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- RENDER SIDEBAR RECOMMENDATIONS ---
        function renderSidebar() {
            sidebarList.innerHTML = "";
            
            let sortedSidebar = [...vidbase].map((item, idx) => ({ item, idx })).sort((a, b) => new Date(b.item.release) - new Date(a.item.release));
            const otherVideos = sortedSidebar.filter(obj => obj.idx !== currentVideoIndex);
            const visibleVideos = otherVideos.slice(0, sidebarDisplayLimit);

            visibleVideos.forEach(({ item, idx }) => {
                const sidebarFavoriteHtml = item.star ? `
                    <div class="favorite-badge">
                        <i class="fa-solid fa-star"></i>
                    </div>
                ` : '';

                const sCard = document.createElement('div');
                sCard.className = 'sidebar-card';
                sCard.innerHTML = `
                    <div class="sidebar-thumb">
                        ${sidebarFavoriteHtml}
                        <img src="${item.imgurl}" alt="${item.title}">
                    </div>
                    <div class="sidebar-info">
                        <h4>${item.title}</h4>
                        <p>${item.category} • ${item.duration}</p>
                    </div>
                `;
                sCard.addEventListener('click', () => {
                    navigateToPlayer(idx);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                sidebarList.appendChild(sCard);
            });

            if (sidebarDisplayLimit >= otherVideos.length) {
                sidebarMoreBtn.style.display = 'none';
            } else {
                sidebarMoreBtn.style.display = 'block';
            }
        }

        function loadMoreSidebar() {
            sidebarDisplayLimit += 5;
            renderSidebar();
        }

        function navigateToHome() {
            currentSearchQuery = "";
            isFavoriteFilterActive = false;
            searchInput.value = "";
            renderHome();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- FUNGSI FILTER FAVORITES ---
        function filterFavorites() {
            isFavoriteFilterActive = true;
            currentSearchQuery = "";
            currentPage = 1;
            navDropdownMenu.classList.remove('active');
            renderHome();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- FUNGSI PENCARIAN & CLEAR SEARCH ---
        function triggerSearch() {
            currentSearchQuery = searchInput.value;
            isFavoriteFilterActive = false;
            currentPage = 1;
            searchModal.classList.remove('active');
            renderHome();
        }

        function clearSearch() {
            currentSearchQuery = "";
            isFavoriteFilterActive = false;
            searchInput.value = "";
            currentPage = 1;
            renderHome();
        }

        // --- EVENT LISTENERS DROPDOWN & MODAL ---
        openMenuDropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!navDropdownMenu.contains(e.target) && e.target !== openMenuDropdownBtn) {
                navDropdownMenu.classList.remove('active');
            }
        });

        openSearchModalBtn.addEventListener('click', () => {
            searchModal.classList.add('active');
            searchInput.focus();
        });

        closeSearchModalBtn.addEventListener('click', () => {
            searchModal.classList.remove('active');
        });

        searchModal.addEventListener('click', (e) => {
            if (e.target === searchModal) searchModal.classList.remove('active');
        });

        executeSearchBtn.addEventListener('click', () => {
            triggerSearch();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        });

        // Inisialisasi awal SPA
        renderHome();
    </script>
</body>
</html>
