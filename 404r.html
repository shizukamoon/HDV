<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terjadi Kesalahan - HDV.com</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a2e'/><text x='50%' y='57%' dominant-baseline='middle' text-anchor='middle' font-family='Poppins, sans-serif' font-weight='700' font-size='40' fill='%23e94560'>HDV</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 22px;
            max-width: 420px;
        }

        .refresh-btn {
            width: 84px;
            height: 84px;
            border: none;
            border-radius: 50%;
            background-color: #e94560;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(233, 69, 96, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }
        .refresh-btn:hover {
            background-color: #d63a54;
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(233, 69, 96, 0.45);
        }
        .refresh-btn:active { transform: scale(0.95); }
        .refresh-btn:focus-visible { outline: 3px solid #1a1a2e; outline-offset: 4px; }
        .refresh-btn svg { width: 38px; height: 38px; }
        .refresh-btn.loading svg { animation: spin 0.8s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-text {
            font-size: 0.98rem;
            font-weight: 500;
            line-height: 1.7;
            color: #1a1a2e;
        }
    </style>
</head>
<body>

    <div class="error-box">
        <button type="button" class="refresh-btn" id="refreshBtn" aria-label="Refresh halaman" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                <polyline points="21 3 21 9 15 9"/>
            </svg>
        </button>
        <p class="error-text">Maaf ada kesalahan server atau coba periksa jaringan internet anda.</p>
    </div>

    <script>
        document.getElementById('refreshBtn').addEventListener('click', function () {
            this.classList.add('loading');
            location.reload();
        });
    </script>
</body>
</html>
